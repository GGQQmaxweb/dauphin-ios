on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read version from project
        id: version
        run: |
          VER=$(grep -m1 'MARKETING_VERSION' app/dauphin.xcodeproj/project.pbxproj \
            | sed 's/.*MARKETING_VERSION = //;s/;//;s/ //')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "IPA name: dauphin_${VER}.ipa"

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'

      - name: Install Dependencies
        run: brew install ldid xz

      - name: Build IPA
        run: |
          chmod +x ./scripts/build.command
          bash ./scripts/build.command

      - name: Rename IPA
        run: mv dauphin.ipa "dauphin_${{ steps.version.outputs.version }}.ipa"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "dauphin v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          files: "dauphin_${{ steps.version.outputs.version }}.ipa"

